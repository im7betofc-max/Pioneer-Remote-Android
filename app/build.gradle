plugins {
    id 'com.android.application'
}

android {
    namespace 'com.imscripts.pioneerremote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.imscripts.pioneerremote'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '2.1-internet-qrfix'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
