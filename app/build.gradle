plugins {
    id 'com.android.application'
}

android {
    namespace 'com.imscripts.pioneerremote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.imscripts.pioneerremote'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
